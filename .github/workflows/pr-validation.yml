name: PR Validation

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore MaxTemp.sln

      - name: Build Solution
        run: msbuild MaxTemp.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            **/*.binlog